# Сборка и тесты в облаке: локально на Windows тестовый воркер Gradle не стартует,
# и это единственное место, где юнит-тесты тракта реально прогоняются.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 не запускается на JDK 25. 17 — то же, на чём собирается локально.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # compileSdk 35: на раннере нужная платформа может отсутствовать.
      - name: Доставить SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # APK собирается до тестов и выкладывается сразу: даже если тест упадёт,
      # собранное приложение остаётся доступным для поля.
      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: noise-field-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Юнит-тесты
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Отчёты нужны именно тогда, когда тесты упали.
      - name: Выложить отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
